<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>语音输入法助手</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Go Voice Input</p>
          <h1>语音输入法助手</h1>
        </div>
        <div class="status-stack">
          <span id="providerBadge" class="badge">检测中</span>
          <span id="statusBadge" class="badge badge-muted">准备就绪</span>
        </div>
      </header>

      <section class="layout">
        <section class="main-pane">
          <section class="recorder-panel">
            <div class="record-copy">
              <h2>语音录入</h2>
              <p id="status">点击开始录音，再次点击识别。</p>
            </div>
            <div class="record-zone">
              <button id="recordButton" class="record-button" type="button">
                <span class="record-dot"></span>
                <span id="recordButtonText">开始录音</span>
              </button>
              <div class="meter-wrap">
                <div class="meter-label">
                  <span>麦克风音量</span>
                  <span id="timerText">00:00</span>
                </div>
                <div class="meter" aria-hidden="true"><span id="meterBar"></span></div>
              </div>
            </div>
          </section>

          <section class="editor-panel">
            <div class="section-title">
              <div>
                <h2>识别结果</h2>
                <p id="resultMeta">暂无文本</p>
              </div>
              <div class="actions compact-actions">
                <button id="processButton" type="button">处理文本</button>
                <button id="copyButton" type="button">复制</button>
                <button id="clearButton" class="ghost-button" type="button">清空</button>
              </div>
            </div>
            <textarea id="resultText" rows="10" placeholder="识别结果"></textarea>
            <div id="messageBar" class="message-bar" hidden></div>
          </section>
        </section>

        <aside class="side-pane">
          <section class="panel">
            <div class="section-title tight">
              <h2>文本处理</h2>
              <button id="saveSettingsButton" type="button">保存</button>
            </div>
            <label class="switch-row">
              <input id="autoPunctuation" type="checkbox" />
              <span>
                <strong>自动标点</strong>
                <small>标点</small>
              </span>
            </label>
            <label class="switch-row">
              <input id="removeFillers" type="checkbox" />
              <span>
                <strong>清理语气词</strong>
                <small>清洗</small>
              </span>
            </label>
            <label class="switch-row">
              <input id="enableCommands" type="checkbox" />
              <span>
                <strong>启用口令</strong>
                <small>口令</small>
              </span>
            </label>
          </section>

          <section class="panel history-panel">
            <div class="section-title tight">
              <div>
                <h2>历史记录</h2>
                <p id="historyCount">0 条</p>
              </div>
              <button id="clearHistoryButton" class="ghost-button" type="button">清空</button>
            </div>
            <div id="historyList" class="history-list"></div>
          </section>
        </aside>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
